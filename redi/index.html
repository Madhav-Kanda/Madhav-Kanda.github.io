<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Divide and Reason: Joint Image and Language Decomposition for Compositional Reasoning</title>
  <style>
    :root {
      --text: #333;
      --accent: #4A90E2;
      --bg-light: #f8f9fa;
      --shadow: 0 4px 20px rgba(0,0,0,.08);
      --rad: 12px;
    }
    * {box-sizing:border-box; margin:0; padding:0;}
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      max-width: 1000px;
      margin: 0 auto;
      padding: 60px 20px;
      line-height: 1.6;
      background:#fff;
      color: var(--text);
    }

    h1{font-size:48px;font-weight:400;text-align:center;margin-bottom:40px;line-height:1.1;}

    /* ---------- VIDEO: HIDE NATIVE CONTROLS ---------- */
    video::-webkit-media-controls,
    video::-webkit-media-controls-enclosure,
    video::-webkit-media-controls-panel {
      display: none !important;
      opacity: 0 !important;
    }

    /* ---------- CAROUSEL ---------- */
    .carousel-container {
      position: relative;
      max-width: 100%;
      height: 620px;
      margin: 30px auto 60px;
      overflow: hidden;
      border-radius: 12px;
      box-shadow: var(--shadow);
      background:#fff;
    }
    .carousel-slide {
      display: flex;
      height: 100%;
      transition: transform 0.5s ease-in-out;
    }
    .carousel-slide img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background:white;
      padding: 10px;
    }

    .carousel-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0,0,0,0.4);
      color: #fff;
      border: none;
      font-size: 24px;
      padding: 8px 12px;
      border-radius: 50%;
      cursor: pointer;
      transition:.2s;
      z-index: 10;
    }
    #prevBtn { left: 10px; }
    #nextBtn { right: 10px; }
    .carousel-btn:hover { background: rgba(0,0,0,0.7); }

    .carousel-dots {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
    }
    .dot {
      width: 12px;
      height: 12px;
      background: #ccc;
      border-radius: 50%;
      cursor: pointer;
    }
    .dot.active { background: var(--accent); }

    @media(max-width:768px){
      h1{font-size:36px;}
      .carousel-container { height: 480px; }
    }
  </style>
</head>

<body>

  <h1>Divide and Reason: Joint Image and Language Decomposition</h1>

  <!-- ------------ METHOD VIDEO SECTION ----------- -->
  <section>
    <h2 style="text-align:center;font-size:36px;margin-bottom:30px;">Method Overview</h2>
    <video autoplay loop muted playsinline style="width:100%;height:auto;border-radius:12px;">
      <source src="Redi-main.mp4" type="video/mp4">
    </video>
  </section>

  <!-- ------------ RESULTS CAROUSEL (IMAGE VERSION) ----------- -->
  <section id="results">
    <h2 style="text-align:center;font-size:36px;font-weight:600;margin:50px 0 20px;">
      Qualitative Results
    </h2>
    <p style="text-align:center;font-size:18px;color:#666;margin-bottom:20px;">
      Each example shows how our method adapts to different question, and answer pair for appropriately answering it.
    </p>

    <div class="carousel-container">
      <button class="carousel-btn" id="prevBtn">&#10094;</button>

      <div class="carousel-slide" id="carouselSlide">
        <img src="qual-results/qual_1.png" class="slide" />
        <img src="qual-results/qual_2.png" class="slide" />
        <img src="qual-results/qual_3.png" class="slide" />
        <img src="qual-results/qual_4.png" class="slide" />
      </div>

      <button class="carousel-btn" id="nextBtn">&#10095;</button>
    </div>

    <div class="carousel-dots">
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>
  </section>


<!-- ------------ CAROUSEL SCRIPT (AUTO-ADVANCE) ----------- -->
<script>
let slideIndex = 0;
const slides = document.querySelectorAll(".slide");
const dots = document.querySelectorAll(".dot");
const totalSlides = slides.length;
const slideTrack = document.getElementById("carouselSlide");

function showSlide(i) {
  slideIndex = (i + totalSlides) % totalSlides;
  slideTrack.style.transform = `translateX(${-slideIndex * 100}%)`;

  dots.forEach(dot => dot.classList.remove("active"));
  dots[slideIndex].classList.add("active");
}

document.getElementById("prevBtn").addEventListener("click", () => {
  showSlide(slideIndex - 1);
});
document.getElementById("nextBtn").addEventListener("click", () => {
  showSlide(slideIndex + 1);
});

dots.forEach((dot, i) => {
  dot.addEventListener("click", () => showSlide(i));
});

/* ----- AUTO-ADVANCE EVERY 6 SECONDS ----- */
setInterval(() => {
  showSlide(slideIndex + 1);
}, 6000);

showSlide(0);
</script>

</body>
</html>
